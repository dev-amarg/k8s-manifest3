apiVersion: apps/v1

kind: Deployment

metadata:
  name: k8s-manifest3
  namespace: my-app3

spec:
  replicas: 2
  selector:
    matchLabels:
      app: vite3

  template:
    metadata:
      labels:
        app: vite3

    spec:
      containers:
      - name: vite3
        image: 8076381912/argocd:v2
        ports:
        - containerPort: 80

---

apiVersion: v1

kind: Service

metadata:
  name: my-app3-service
  namespace: my-app3

spec:
  selector:
    app: vite3
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30086

